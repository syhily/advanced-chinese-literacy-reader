name: release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        # 固定版本与本地开发一致：Ubuntu 仓库的 pandoc 3.1.3 会把行块渲染成
        # 无 class 的 <p>，与新版本产物结构不同
        run: |
          PANDOC_VERSION=3.12.1
          wget -q "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i "pandoc-${PANDOC_VERSION}-1-amd64.deb"

      - name: Build EPUB
        run: make

      - name: Check EPUB
        run: make check

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" advanced-chinese-literacy-reader.epub --title "$GITHUB_REF_NAME" --generate-notes
